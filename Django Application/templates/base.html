<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/jquery-ui.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/styles.css'%}">
    <title>Fake Video Content Detection</title>
</head>
<body>
    <div class="app-shell">
        <main class="main-panel">
            <header class="top-navbar">
                <a href="{%url 'ml_app:home'%}" class="brand-block text-decoration-none mb-0">
                    <div class="brand-logo">AI</div>
                    <div>
                        <h1 class="brand-title">Fake Video Content Detection</h1>
                        <p class="brand-subtitle">AI authenticity analyzer</p>
                    </div>
                </a>
                <a href="{%url 'ml_app:home'%}" class="btn btn-primary px-4">New Upload</a>
            </header>

            <section class="content-area">
                {%block content%}
                {%endblock%}
            </section>
        </main>
    </div>

    <script src="/static/js/jquery-3.4.1.min.js" ></script>
    <script src="/static/js/popper.min.js"></script>
    <script src="/static/js/jquery-ui.min.js"></script>
    {%block js_cripts%}
    {%endblock%}
</body>

</html>
